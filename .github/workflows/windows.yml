name: windows-2025

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Run independent verification
        shell: pwsh
        run: npm run verify

      - name: Record Windows host audit
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verification/evidence -Force | Out-Null
          $audit = [ordered]@{
            generated_at_utc = [DateTime]::UtcNow.ToString('o')
            workflow_run_id = $env:GITHUB_RUN_ID
            git_commit_sha = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            powershell = $PSVersionTable.PSVersion.ToString()
            node = (& node --version)
          }
          $audit | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath verification/evidence/windows-audit.json -Encoding utf8

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q10107-windows-evidence
          path: verification/evidence/
          if-no-files-found: error
          retention-days: 1
